# Cloud Run serves on 8080. Accept any Host (including *.run.app) so staging/prod
# do not hit a default-server "Site Not Found" style rejection.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
