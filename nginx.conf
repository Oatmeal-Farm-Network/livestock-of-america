# Cloud Run serves on 8080. Accept any Host (including *.run.app) so staging/prod
# do not hit a default-server "Site Not Found" style rejection.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    # .js is served as text/javascript by newer nginx and application/javascript
    # by older builds, so both are listed or the main bundle ships uncompressed.
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Vite writes a content hash into every filename under /assets, so a given
    # URL's bytes can never change. Cache them for a year and skip revalidation
    # entirely; a new build simply requests new filenames.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Files copied from public/ keep their names across builds, so they get a
    # week rather than a year — long enough to stop refetching on every visit,
    # short enough that replacing a logo is picked up without a cache bust.
    location ~* \.(png|jpe?g|webp|gif|svg|ico|avif|woff2?|ttf|eot|mp4|webm)$ {
        add_header Cache-Control "public, max-age=604800";
        # Without this a missing image falls through to the SPA rewrite below
        # and returns 200 text/html, which browsers then try to decode as an
        # image (loa-flag-bg.webp was doing exactly that).
        try_files $uri =404;
    }

    # Small text files that crawlers read directly. They must be served as
    # themselves, not swallowed by the SPA fallback.
    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /llms.txt {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # SPA client-side routing. index.html itself must never be cached, or a
    # deploy keeps serving the old document — and the old document points at
    # hashed asset URLs that no longer exist.
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
