name: Deploy LOA Frontend Staging

# GCP/frontend-staging → livestock-frontend-staging (oatmeal-farm-staging)
# API target: oatmeal-livestock-staging only (not OFN main backend).
on:
  push:
    branches: [GCP/frontend-staging]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.STAGING_GCP_PROJECT_ID }}
  REGION: ${{ vars.STAGING_REGION || 'us-central1' }}
  GAR_REPOSITORY: ${{ vars.STAGING_ARTIFACT_REGISTRY_REPOSITORY || 'oatmeal-farm-registry' }}
  SERVICE_NAME: livestock-frontend-staging
  IMAGE_NAME: livestock-frontend
  RUNTIME_SERVICE_ACCOUNT: ${{ vars.STAGING_FRONTEND_RUNTIME_SA || 'livestock-of-america@oatmeal-farm-staging.iam.gserviceaccount.com' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Require staging bake vars
        shell: bash
        run: |
          if [ -z "${{ vars.STAGING_LIVESTOCK_API_URL }}" ]; then
            echo "::error::Missing required GitHub Actions variable: STAGING_LIVESTOCK_API_URL"
            echo "Set it to the oatmeal-livestock-staging Cloud Run URL."
            exit 1
          fi

      - name: Derive commit SHA tag
        shell: bash
        run: echo "COMMIT_SHA=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.STAGING_GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build Docker image (bake staging VITE_*)
        env:
          VITE_LIVESTOCK_API_URL: ${{ vars.STAGING_LIVESTOCK_API_URL }}
          VITE_NEWS_API_URL: ${{ vars.STAGING_NEWS_API_URL || 'https://oatmeal-ai.com' }}
          VITE_SAIGE_API_URL: ${{ vars.STAGING_SAIGE_URL }}
          VITE_CONTACT_EMAIL: ${{ vars.STAGING_CONTACT_EMAIL }}
        run: |
          docker build \
            --build-arg "VITE_LIVESTOCK_API_URL=${VITE_LIVESTOCK_API_URL}" \
            --build-arg "VITE_NEWS_API_URL=${VITE_NEWS_API_URL}" \
            --build-arg "VITE_SAIGE_API_URL=${VITE_SAIGE_API_URL}" \
            --build-arg "VITE_CONTACT_EMAIL=${VITE_CONTACT_EMAIL}" \
            -t "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}" \
            .

      - name: Push Docker image
        run: |
          docker push "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}"

      - name: Deploy to Cloud Run (staging)
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --image "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5 \
            --service-account "${RUNTIME_SERVICE_ACCOUNT}" \
            --quiet

      - name: Show deployed URL
        run: |
          gcloud run services describe "${SERVICE_NAME}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --format='value(status.url)'
