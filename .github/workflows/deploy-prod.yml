name: Deploy LOA Frontend Production

# main → livestock-frontend-prod
# API target: livestock prod Cloud Run only (not OFN main backend).
# Do not deploy until prod vars exist; fail clearly if missing.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Defaults are resource identifiers, not credentials — auth is keyless via
# Workload Identity Federation, and the security boundary is the IAM binding
# on the deployer service account, which only trusts tokens carrying
# attribute.repository == this repo. Any value can still be overridden with a
# secret or repository variable of the same name.
env:
  PROJECT_ID: ${{ secrets.PROD_GCP_PROJECT_ID || 'animated-flare-421518' }}
  REGION: ${{ vars.PROD_REGION || 'us-central1' }}
  GAR_REPOSITORY: ${{ vars.PROD_ARTIFACT_REGISTRY_REPOSITORY || 'oatmeal-farm-registry' }}
  SERVICE_NAME: livestock-frontend-prod
  IMAGE_NAME: livestock-frontend
  RUNTIME_SERVICE_ACCOUNT: ${{ vars.PROD_FRONTEND_RUNTIME_SA || 'livestock-of-america@animated-flare-421518.iam.gserviceaccount.com' }}
  WIF_PROVIDER: ${{ secrets.PROD_GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/802455386518/locations/global/workloadIdentityPools/github-pool/providers/github-provider' }}
  DEPLOYER_SA: ${{ secrets.PROD_GCP_SERVICE_ACCOUNT || 'github-deployer@animated-flare-421518.iam.gserviceaccount.com' }}
  LIVESTOCK_API_URL: ${{ vars.PROD_LIVESTOCK_API_URL || 'https://livestock-backend-prod-802455386518.us-central1.run.app' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Require production secrets and bake vars
        shell: bash
        run: |
          missing=0
          require() {
            local name="$1" value="$2"
            if [ -z "$value" ]; then
              echo "::error::Missing required GitHub Actions secret/variable: $name"
              missing=1
            fi
          }
          require PROJECT_ID "${PROJECT_ID}"
          require WIF_PROVIDER "${WIF_PROVIDER}"
          require DEPLOYER_SA "${DEPLOYER_SA}"
          require RUNTIME_SERVICE_ACCOUNT "${RUNTIME_SERVICE_ACCOUNT}"
          require LIVESTOCK_API_URL "${LIVESTOCK_API_URL}"
          if [ "$missing" -ne 0 ]; then
            echo "Production deploy blocked: a required value resolved empty."
            echo "See docs/LOA_FRONTEND_DEPLOY.md — livestock API URL required (no OFN backend)."
            exit 1
          fi

      - name: Derive commit SHA tag
        shell: bash
        run: echo "COMMIT_SHA=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build Docker image (bake production VITE_*)
        env:
          VITE_LIVESTOCK_API_URL: ${{ env.LIVESTOCK_API_URL }}
          VITE_NEWS_API_URL: ${{ vars.PROD_NEWS_API_URL || 'https://oatmeal-ai.com' }}
          VITE_SAIGE_API_URL: ${{ vars.PROD_SAIGE_URL }}
          VITE_CONTACT_EMAIL: ${{ vars.PROD_CONTACT_EMAIL }}
        run: |
          docker build \
            --build-arg "VITE_LIVESTOCK_API_URL=${VITE_LIVESTOCK_API_URL}" \
            --build-arg "VITE_NEWS_API_URL=${VITE_NEWS_API_URL}" \
            --build-arg "VITE_SAIGE_API_URL=${VITE_SAIGE_API_URL}" \
            --build-arg "VITE_CONTACT_EMAIL=${VITE_CONTACT_EMAIL}" \
            -t "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}" \
            .

      - name: Push Docker image
        run: |
          docker push "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}"

      - name: Deploy to Cloud Run (production)
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --image "${REGION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${COMMIT_SHA}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --service-account "${RUNTIME_SERVICE_ACCOUNT}" \
            --quiet

      - name: Show deployed URL
        run: |
          gcloud run services describe "${SERVICE_NAME}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --format='value(status.url)'
