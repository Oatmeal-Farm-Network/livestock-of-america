<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Woven-fabric grain -->
    <filter id="cloth" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.035" numOctaves="3" seed="7" result="n"/>
