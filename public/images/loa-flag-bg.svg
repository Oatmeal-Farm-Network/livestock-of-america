      <feGaussianBlur in="d" stdDeviation="3.2"/>
    </filter>
    <!-- Focus falls off toward the right, as in the photo -->
    <linearGradient id="focus" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#f7f2e8" stop-opacity="0.10"/>
      <stop offset="45%"  stop-color="#f7f2e8" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#f7f2e8" stop-opacity="0.62"/>
    </linearGradient>
    <!-- Light blooming in from the top-left -->
    <radialGradient id="bloom" cx="18%" cy="12%" r="85%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

